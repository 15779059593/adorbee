[pytest]
# 测试目录
testpaths = testcases

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行默认参数
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results

# 标记定义
markers =
    smoke: 冒烟测试
    regression: 回归测试
    device: 设备管理相关
    live: 直播功能相关
    settings: 设置相关
    network: 网络相关
    ui: UI显示相关

# 超时设置（秒）
timeout = 300

# 失败重试
# reruns = 1
# reruns_delay = 2

# 日志级别
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
